<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Recuperar Contraseña</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="assets/css/login2.css">
</head>

<body>

  <div class="container-fluid min-vh-100 d-flex justify-content-center align-items-start">

    <div class="login-form bg-white bg-opacity-90 p-5 mt-5">

      <!-- Logo -->
      <div class="text-center mb-4">
        <img
          src="assets/img/ulimaLogo.png"
          width="203"
          height="50"
          alt="Universidad de Lima"
        >
      </div>

      <!-- Título -->
      <div class="text-center mb-4">
        <h3>Recuperar Contraseña</h3>
        <p class="text-muted">
          Ingrese su correo electrónico para recibir instrucciones de recuperación.
        </p>
      </div>

      <!-- Correo -->
      <div class="mb-4">
        <label for="txtEmail" class="form-label">
          Correo electrónico
        </label>

        <input
          class="form-control"
          type="email"
          id="txtEmail"
          placeholder="ejemplo@ulima.edu.pe"
        >
      </div>

      <!-- Botón -->
      <div class="d-grid mb-3">
        <button type="button" class="btn btn-dark">
          Enviar enlace de recuperación
        </button>
      </div>

      <!-- Volver -->
      <div class="text-center mb-4">
        <a href="login2.html">
          Volver al inicio de sesión
        </a>
      </div>

      <!-- Mensaje informativo -->
      <div class="alert alert-secondary mb-4">
        Si el correo ingresado está registrado en el sistema, recibirá un enlace para restablecer su contraseña.
      </div>

      <!-- Copyright -->
      <div class="text-center">
        <small class="text-muted">
          © 1997-2026 Blackboard Inc. Todos los derechos reservados.
        </small>
      </div>

    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
